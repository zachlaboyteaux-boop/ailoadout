<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The AI Loadout – the best AI tools for every job</title>
<meta name="description" content="The AI Loadout: AI tools ranked by use case, plus the newest AI releases.">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="canonical" href="https://zachlaboyteaux-boop.github.io/ailoadout/">
<meta property="og:type" content="website"><meta property="og:title" content="The AI Loadout – the best AI tools for every job"><meta property="og:description" content="AI tools ranked by use case (coding, agents, image, video, game dev and more), plus the newest AI releases."><meta property="og:url" content="https://zachlaboyteaux-boop.github.io/ailoadout/"><meta property="og:image" content="https://zachlaboyteaux-boop.github.io/ailoadout/og.svg">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="The AI Loadout"><meta name="twitter:description" content="AI tools ranked for every job, plus fresh drops."><meta name="twitter:image" content="https://zachlaboyteaux-boop.github.io/ailoadout/og.svg">
<style>
:root{--bg:#0b0d12;--card:#141823;--line:#232a3a;--txt:#e7eaf2;--mut:#8b93a7;--acc:#7cff6b;--acc2:#5ac8ff}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
a{color:var(--acc2)}.wrap{max-width:1100px;margin:auto;padding:20px}
header h1{font-size:clamp(28px,6vw,46px);margin:10px 0 4px;letter-spacing:-1px}header h1 span{color:var(--acc)}
header p{color:var(--mut);margin:0 0 18px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:6px 12px;border-radius:99px;cursor:pointer;font-size:13px}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
h2{margin:30px 0 6px}h3{margin:22px 0 10px;color:var(--acc);font-size:17px;text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative}
.card .r{position:absolute;top:12px;right:12px;font-weight:800;color:var(--acc)}.card a.n{font-weight:700;font-size:16px;color:var(--txt);text-decoration:none}
.card p{margin:6px 0;color:var(--mut)}.tag{font-size:12px;color:var(--acc2)}
.rel{border-left:3px solid var(--acc2)}.date{font-size:12px;color:var(--acc)}
.sign{margin:36px 0;padding:18px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.sign input{max-width:320px;display:inline-block}.sign button{padding:12px 16px;border-radius:10px;border:0;background:#333;color:var(--mut);margin-top:8px}
footer{color:var(--mut);font-size:12px;padding:20px 0}
</style></head><body><div class="wrap">
<header><h1>The AI <span>Loadout</span></h1><p>Pick your mission. We'll tell you the gear. AI tools ranked for every job, plus fresh drops.</p></header>
<h2>🆕 New Releases</h2><div id="rel" class="grid"></div>
<h2>🎒 Loadouts</h2>
<input id="q" placeholder="Search tools, e.g. 'video', 'free', 'agents'…" aria-label="Search">
<div id="chips" class="chips"></div><div id="list"></div>
<div class="sign"><b>Weekly "what to equip now" email — coming soon</b><br><input disabled placeholder="you@example.com"> <button disabled>Notify me (soon)</button></div>
<footer>Data in <a href="tools.json">tools.json</a>. Last updated <span id="up"></span>. Rankings are editorial opinions; pricing changes often, check each site.</footer>
</div><script>
let D,cat="All";const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch("tools.json").then(r=>r.json()).then(d=>{D=d;$("#up").textContent=d.updated;
$("#rel").innerHTML=d.releases.map(r=>`<div class="card rel"><div class="date">${e(r.date)}</div><a class="n" href="${e(r.url)}" target="_blank" rel="noopener">${e(r.name)}</a><p>${e(r.what)}</p><span class="tag">via ${e(r.source)}</span></div>`).join("");
const cats=["All",...new Set(d.tools.map(t=>t.category))];
$("#chips").innerHTML=cats.map(c=>`<button class="chip${c==cat?' on':''}">${e(c)}</button>`).join("");
$("#chips").onclick=ev=>{if(ev.target.tagName!="BUTTON")return;cat=ev.target.textContent;[...$("#chips").children].forEach(b=>b.classList.toggle("on",b.textContent==cat));draw()};
$("#q").oninput=draw;draw()});
function draw(){const q=$("#q").value.toLowerCase();const g={};
D.tools.filter(t=>(cat=="All"||t.category==cat)&&(!q||Object.values(t).join(" ").toLowerCase().includes(q))).forEach(t=>(g[t.category]=g[t.category]||[]).push(t));
$("#list").innerHTML=Object.keys(g).map(c=>`<h3>${e(c)} loadout</h3><div class="grid">${g[c].sort((a,b)=>a.rank-b.rank).map(t=>`<div class="card"><span class="r">#${t.rank}</span><a class="n" href="${e(t.url)}" target="_blank" rel="noopener">${e(t.name)}</a><p>${e(t.verdict)}</p><span class="tag">${e(t.pricing)}</span></div>`).join("")}</div>`).join("")||"<p>No tools match.</p>"}
</script></body></html>
