name: Decode base64 binaries
# The GitHub connector can only push text, so binary assets are committed as <file>.b64
# and this workflow decodes them into the real binary file.
on:
  push:
    paths: ["**.b64"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in $(git ls-files '*.b64'); do base64 -d "$f" > "${f%.b64}"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Decode binary assets from .b64" && git push)
